[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omop-mdd"
version = "0.1.0"
description = "Synthetic OMOP demonstration of cohort SQL and leakage-safe case-control classification"
requires-python = ">=3.13"
authors = [{ name = "Rishab Haldar" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "duckdb",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
